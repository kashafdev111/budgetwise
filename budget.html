<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BudgetWise — Monthly Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-shell">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">B</span>
        <span class="brand-name">BudgetWise</span>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-target="dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>
          Dashboard
        </button>
        <button class="nav-item" data-target="add">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Expense
        </button>
        <button class="nav-item" data-target="history">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          History
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="account-info">
          <span id="user-email" class="user-email"></span>
          <button id="logout-btn" class="logout-btn">Logout</button>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">
      <!-- DASHBOARD PAGE -->
      <section id="page-dashboard" class="page active">
        <div class="page-header">
          <h1>Dashboard</h1>
          <div class="month-select">
            <label for="month">Month:</label>
            <input type="month" id="month" />
          </div>
        </div>

        <div class="dashboard-grid">
          <div class="card summary-card">
            <h3>Summary</h3>
            <input type="number" id="budget" placeholder="Set Monthly Budget (PKR)" />
            <div class="total" id="total">Total: 0 PKR</div>
          </div>

          <div class="card chart-card">
            <canvas id="expenseChart" width="320" height="240"></canvas>
          </div>

          <div class="card breakdown-card">
            <h4>Category Breakdown</h4>
            <div id="breakdown" class="breakdown"></div>
          </div>
        </div>
      </section>

      <!-- ADD EXPENSE PAGE -->
      <section id="page-add" class="page">
        <div class="page-header">
          <h1>Add Expense</h1>
        </div>

        <div class="card form-card">
          <input id="expense-name" type="text" placeholder="Expense Name" />
          <input id="expense-amount" type="number" step="100" inputmode="numeric" placeholder="Amount (PKR)" min="100" />
          <select id="expense-category">
            <option value="">Select Category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Shopping">Shopping</option>
            <option value="Health">Health</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
          <button id="add-expense">Add Expense</button>
          <button id="cancel-edit" type="button" class="btn-cancel-edit" style="display:none;">Cancel</button>
        </div>
      </section>

      <!-- HISTORY PAGE -->
      <section id="page-history" class="page">
        <div class="page-header">
          <h1>Expense History</h1>
        </div>

        <div class="card" style="margin-bottom:18px;">
          <h3>Monthly Overview</h3>
          <div id="monthly-overview" class="monthly-overview"></div>
        </div>

        <div class="card">
          <h3>This Month's Expenses</h3>
          <ul id="expense-list" class="list"></ul>
        </div>
      </section>
    </main>
  </div>

  <!-- Chatbot widget -->
  <button id="chatbot-toggle" class="chatbot-toggle" aria-label="Open chat assistant">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
  </button>
  <div id="chatbot-panel" class="chatbot-panel">
    <div class="chatbot-header">
      <span>BudgetWise Assistant</span>
      <button id="chatbot-close" aria-label="Close chat">✕</button>
    </div>
    <div id="chatbot-messages" class="chatbot-messages"></div>
    <form id="chatbot-form" class="chatbot-form">
      <input id="chatbot-input" type="text" placeholder="Ask about your spending..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script src="script.js"></script>
  <script src="chatbot.js"></script>
  <script>
    // Page navigation (feels like separate pages, no reload)
    document.querySelectorAll(".nav-item").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".nav-item").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll(".page").forEach((p) => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("page-" + btn.dataset.target).classList.add("active");
      });
    });
  </script>
</body>
</html>
